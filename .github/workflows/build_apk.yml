name: Build Hark Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Scaffold Android platform if missing
      run: |
        if [ ! -d "android" ]; then
          flutter create --org com.antigravity --project-name hark_pro_mobile --platforms=android .
        fi
        for f in android/app/build.gradle android/app/build.gradle.kts; do
          if [ -f "$f" ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.antigravity.hark"/g' "$f"
            sed -i 's/applicationId "[^"]*"/applicationId "com.antigravity.hark"/g' "$f"
            sed -i 's/compileSdk = .*/compileSdk = 35/g' "$f"
            sed -i 's/compileSdkVersion .*/compileSdkVersion 35/g' "$f"
            sed -i 's/targetSdk = .*/targetSdk = 35/g' "$f"
            sed -i 's/targetSdkVersion .*/targetSdkVersion 35/g' "$f"
            sed -i 's/minSdk = .*/minSdk = 24/g' "$f"
            sed -i 's/minSdkVersion .*/minSdkVersion 24/g' "$f"
          fi
        done

    - name: Install Flutter dependencies
      run: flutter pub get

    - name: Build Release APK (Split Per ABI)
      run: |
        flutter build apk --release --split-per-abi --target-platform android-arm64
        ls -la build/app/outputs/flutter-apk/
        mkdir -p ../build/app/outputs/flutter-apk/ 2>/dev/null || true
        cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../build/app/outputs/flutter-apk/ 2>/dev/null || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HarkPro-Release-APK
        path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
